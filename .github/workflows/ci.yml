name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 밀면 앞의 실행은 취소한다. 러너 시간이 아깝다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # node 를 먼저 깔고 그 위에 pnpm 을 올린다. 순서가 반대면 pnpm 이 러너의 기본 node 로
      # 설치돼 뒤에 오는 setup-node 와 어긋난다.
      # **22 여야 한다** — package.json 이 못 박은 pnpm 11 의 engines 가 `node >=22.13` 이다.
      # 20 으로 두면 pnpm 을 부르는 스텝마다 UNSUPPORTED_ENGINE 으로 1초 만에 죽는다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 쓸 버전은 package.json 의 packageManager 가 정한다.
      - uses: pnpm/action-setup@v4
      # setup-node 의 `cache: pnpm` 은 쓰지 않는다. 그 옵션은 `pnpm store path` 를 부르므로
      # pnpm 이 setup-node 보다 먼저 깔려 있어야 하는데, 그러면 러너의 기본 node 로 pnpm 을
      # 깔게 돼 위의 engines 문제가 되돌아온다. 의존성이 100여 개뿐이라 캐시로 아끼는
      # 시간(20~30초)보다 순서가 단순한 쪽이 낫다.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: cargo test (${{ matrix.os }})
    # 셸·프로세스 트리·경로 처리가 OS 마다 다르게 깨진다. 세 곳에서 다 돌린다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri 의 리눅스 의존성. 다른 OS 는 필요 없다.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # MCP 통합 테스트가 node 로 가짜 서버를 띄운다. 없으면 조용히 건너뛴다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --lib
        working-directory: src-tauri
