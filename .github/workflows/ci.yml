name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 밀면 앞의 실행은 취소한다. 러너 시간이 아깝다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # node 를 먼저 깔고 그 위에 pnpm 을 올린다. 순서가 반대면 pnpm 이 러너의 기본 node 로
      # 설치돼 뒤에 오는 setup-node 와 어긋난다.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 쓸 버전은 package.json 의 packageManager 가 정한다.
      - uses: pnpm/action-setup@v4
      # setup-node 의 `cache: pnpm` 은 쓰지 않는다. 그 옵션은 `pnpm store path` 를 부르는데
      # 거기서 깨진다 — 같은 setup-node 가 cargo 잡 세 곳에서는 캐시 없이 멀쩡히 돈다.
      # 의존성이 100여 개뿐이라 캐시로 아끼는 시간보다 CI 가 조용한 쪽이 낫다.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: cargo test (${{ matrix.os }})
    # 셸·프로세스 트리·경로 처리가 OS 마다 다르게 깨진다. 세 곳에서 다 돌린다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri 의 리눅스 의존성. 다른 OS 는 필요 없다.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # MCP 통합 테스트가 node 로 가짜 서버를 띄운다. 없으면 조용히 건너뛴다.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo test --lib
        working-directory: src-tauri
